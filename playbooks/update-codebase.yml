---
- name: Update Codebase
  hosts: ees_app
  vars_prompt:
    - name: ansible_password
      prompt: "Enter SSH password"
      private: true
  vars:
    app_user: "www-data"
    app_user_home: "/var/www"
    project_root: "/var/www/ees"

  become: true
  tasks:
    - name: Fetch and Pull latest code from Git
      ansible.builtin.git:
        repo: "https://github.com/snbhattacharjya/ees.git"
        dest: "{{ project_root }}"
        update: yes
        force: yes
      become_user: "{{ app_user }}"

    - name: Install/Update Composer Dependencies
      ansible.builtin.shell: "php artisan optimize:clear; php artisan optimize; composer dumpautoload; php artisan octane:reload || true"
      args:
        chdir: "{{ project_root }}"
      environment:
        PATH: "/usr/local/bin:/usr/bin:/bin"
      become_user: "{{ app_user }}"
      ignore_errors: true
